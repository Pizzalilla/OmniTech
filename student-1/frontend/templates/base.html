<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Product Catalog{% endblock %} - OmniTech</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/catalog.css') }}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        .btn-back {
            text-decoration: none;
        }

        .btn-back svg {
            width: 1rem;
            height: 1rem;
            transition: transform 0.2s ease;
        }

        .btn-back:hover svg {
            transform: translateX(-3px);
        }

        .ai-controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .ai-review-btn .ai-btn-busy {
            display: none;
        }

        .ai-review-btn.htmx-request .ai-btn-idle {
            display: none;
        }

        .ai-review-btn.htmx-request .ai-btn-busy {
            display: inline;
        }

        .ai-review-btn:disabled {
            opacity: 0.75;
            cursor: wait;
        }

        .ai-waiting-panel {
            display: none;
            align-items: flex-start;
            gap: 0.85rem;
            margin-top: 1rem;
            padding: 1rem;
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: var(--r-sm);
        }

        .ai-waiting-panel p {
            margin: 0.35rem 0 0;
            color: var(--ink-dim);
            font-size: 0.9rem;
        }

        #ai-output.htmx-request #ai-waiting {
            display: flex;
        }

        #ai-output.htmx-request #ai-review {
            display: none;
        }

        .ai-spinner {
            flex-shrink: 0;
            width: 1.15rem;
            height: 1.15rem;
            margin-top: 0.2rem;
            border: 2px solid var(--line);
            border-top-color: var(--color-slate-blue);
            border-radius: 50%;
            animation: ai-spin 0.8s linear infinite;
        }

        @keyframes ai-spin {
            to { transform: rotate(360deg); }
        }

        .ai-meta {
            color: var(--ink-dim);
            font-size: 0.85rem;
            margin-top: 0.75rem;
        }

        .review-findings h4 {
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }

        .review-findings .finding-label {
            font-weight: 600;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        .review-findings ul {
            margin: 0.25rem 0 0 1.25rem;
            font-size: 0.9rem;
        }
    </style>
    {% block page_css %}{% endblock %}
</head>
<body>
    <div class="frame">
        <div class="shell">
            <nav class="rail" aria-label="Catalog navigation">
                <a class="rail__logo" href="{{ home_url }}" data-tip="OmniTech home">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="7" width="16" height="12" rx="3"/>
                        <path d="M12 7V4"/>
                        <circle cx="12" cy="3" r="1"/>
                    </svg>
                </a>
                <a class="rail__btn {% if request.endpoint in ['catalog', 'product_grid', 'product_detail'] %}active{% endif %}"
                   href="{{ url_for('catalog') }}">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
                        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
                        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
                        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
                    </svg>
                    <span class="rail__label">Shopper</span>
                </a>
                <a class="rail__btn {% if request.endpoint and request.endpoint.startswith('admin') %}active{% endif %}"
                   href="{{ url_for('admin') }}">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
                    </svg>
                    <span class="rail__label">Admin</span>
                </a>
                <div class="rail__spacer"></div>
            </nav>

            <div class="stage">
                <div class="stage__top">
                    <span class="modelpill"><span class="dot"></span> Product Catalog &amp; Specs</span>
                    {% block nav_badge %}{% endblock %}
                    <a class="pill-dark" href="{{ home_url }}">Home</a>
                </div>

                <div class="stage__body">
                    <header class="service-header">
                        <h1>{% block heading %}Product Catalog{% endblock %}</h1>
                        <p>{% block subheading %}Browse OmniTech appliances, specifications, and stock{% endblock %}</p>
                    </header>
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
