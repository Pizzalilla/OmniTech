{% if error %}
<div class="error">
    <strong>The AI summary is unavailable.</strong>
    <p>{{ error }}</p>
</div>
{% else %}
<div class="ai-response">
    <h4>Shopper summary</h4>
    <p>{{ result.summary }}</p>
    <p class="ai-meta">
        Generated by <strong>{{ result.model }}</strong> from the
        {{ spec_count }} specification{{ '' if spec_count == 1 else 's' }} on record.
    </p>
</div>
{% endif %}
