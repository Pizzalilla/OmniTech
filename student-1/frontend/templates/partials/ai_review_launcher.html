<div class="ai-controls">
    <button class="ai-review-btn"
            hx-post="{{ url_for('product_ai_review', product_id=product.id) }}"
            hx-target="#ai-review"
            hx-indicator="#ai-output"
            hx-disabled-elt="this">
        <span class="ai-btn-idle">{{ button_label | default('Summarise specifications') }}</span>
        <span class="ai-btn-busy">Generating&hellip;</span>
    </button>
</div>

<div id="ai-output">
    <div id="ai-waiting" class="ai-waiting-panel" role="status" aria-live="polite">
        <span class="ai-spinner" aria-hidden="true"></span>
        <div>
            <strong>Generating a summary</strong>
            <p>
                The model is writing a shopper paragraph, then a review pass checks
                it against the stored specifications. This often takes 10 to 20 seconds.
            </p>
        </div>
    </div>
    <div id="ai-review"></div>
</div>
