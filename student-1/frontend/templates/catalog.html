{% extends "base.html" %}

{% block content %}
<form id="filter-form"
      hx-get="{{ url_for('product_grid') }}"
      hx-target="#product-grid"
      hx-trigger="input changed delay:300ms, change">

    <div class="composer">
        <input type="search" id="search" name="search" placeholder="Search a product, brand, or what you need&hellip;">
    </div>

    <div class="chips">
        <label class="chip">
            <input type="radio" name="category_id" value="" checked>
            All
        </label>
        {% for category in categories %}
        <label class="chip">
            <input type="radio" name="category_id" value="{{ category.id }}">
            {{ category.name }}
        </label>
        {% endfor %}
    </div>

    <section class="card">
        <h2>More filters</h2>
        <div class="filter-row">
            <div>
                <label for="spec_keyword">Specification keyword</label>
                <input type="search" id="spec_keyword" name="spec_keyword" placeholder="e.g. 12000 BTU">
            </div>
            <div>
                <label for="brand">Brand</label>
                <select id="brand" name="brand">
                    <option value="">All brands</option>
                    {% for brand in brands %}
                    <option value="{{ brand }}">{{ brand }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="price-dropdown">
                <span class="price-dropdown__caption">Price</span>
                <details>
                    <summary>
                        <span id="price-dropdown-label">Any</span>
                    </summary>
                <div class="price-dropdown__panel">
                    <div class="price-slider" data-max="{{ slider_max }}">
                        <div class="price-slider__track" aria-hidden="true"></div>
                        <input type="range" id="min_price_slider" min="0" max="{{ slider_max }}"
                               value="0" step="10" aria-label="Minimum price">
                        <input type="range" id="max_price_slider" min="0" max="{{ slider_max }}"
                               value="{{ slider_max }}" step="10" aria-label="Maximum price">
                    </div>
                    <div class="price-inputs">
                        <div>
                            <label for="min_price">Minimum</label>
                            <input type="number" id="min_price" name="min_price" min="0" step="0.01" placeholder="0">
                        </div>
                        <div>
                            <label for="max_price">Maximum</label>
                            <input type="number" id="max_price" name="max_price" min="0" step="0.01" placeholder="Any">
                        </div>
                    </div>
                </div>
                </details>
            </div>
        </div>
    </section>
</form>
<script>
    (function () {
        var minBox = document.getElementById("min_price");
        var maxBox = document.getElementById("max_price");
        var minSlide = document.getElementById("min_price_slider");
        var maxSlide = document.getElementById("max_price_slider");
        var track = document.querySelector(".price-slider__track");
        var label = document.getElementById("price-dropdown-label");
        var menu = document.querySelector(".price-dropdown details");
        if (!minBox || !maxBox || !minSlide || !maxSlide) {
            return;
        }
        var ceiling = Number(maxSlide.max);

        function paint() {
            var low = Number(minSlide.value);
            var high = Number(maxSlide.value);
            var left = (low / ceiling) * 100;
            var right = (high / ceiling) * 100;
            if (track) {
                track.style.background =
                    "linear-gradient(to right, var(--line) " + left + "%, var(--color-slate-blue) " +
                    left + "%, var(--color-slate-blue) " + right + "%, var(--line) " + right + "%)";
            }
            if (label) {
                label.textContent = (low > 0 || high < ceiling)
                    ? "$" + low + " – $" + high
                    : "Any";
            }
        }

        function fromSlider() {
            var low = Number(minSlide.value);
            var high = Number(maxSlide.value);
            if (low > high) {
                if (this === minSlide) {
                    minSlide.value = high;
                    low = high;
                } else {
                    maxSlide.value = low;
                    high = low;
                }
            }
            minBox.value = low > 0 ? low : "";
            maxBox.value = high < ceiling ? high : "";
            paint();
        }

        function fromBoxes() {
            var low = minBox.value === "" ? 0 : Number(minBox.value);
            var high = maxBox.value === "" ? ceiling : Number(maxBox.value);
            if (Number.isNaN(low)) { low = 0; }
            if (Number.isNaN(high)) { high = ceiling; }
            if (low > high) { high = low; }
            minSlide.value = Math.min(Math.max(low, 0), ceiling);
            maxSlide.value = Math.min(Math.max(high, 0), ceiling);
            paint();
        }

        minSlide.addEventListener("input", fromSlider);
        maxSlide.addEventListener("input", fromSlider);
        minBox.addEventListener("input", fromBoxes);
        maxBox.addEventListener("input", fromBoxes);
        document.addEventListener("click", function (event) {
            if (menu && menu.open && !menu.contains(event.target)) {
                menu.removeAttribute("open");
            }
        });
        paint();
    })();
</script>

<div id="product-grid">
    {% include "partials/product_grid.html" %}
</div>
{% endblock %}
