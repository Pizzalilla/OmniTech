{% extends "base.html" %}

{% block content %}
<div class="page-nav">
    <a class="btn btn-secondary" href="{{ url_for('admin') }}">Manage catalogue</a>
</div>

<section class="card">
    <h2>Search &amp; Filter</h2>

    <form hx-get="{{ url_for('product_grid') }}"
          hx-target="#product-grid"
          hx-trigger="input changed delay:300ms, change">
        <div class="grid-2">
            <div>
                <label for="search">Product or brand</label>
                <input type="search" id="search" name="search" placeholder="e.g. CoolBreeze">

                <label for="spec_keyword">Specification keyword</label>
                <input type="search" id="spec_keyword" name="spec_keyword" placeholder="e.g. 12000 BTU">
            </div>

            <div>
                <label for="category_id">Category</label>
                <select id="category_id" name="category_id">
                    <option value="">All categories</option>
                    {% for category in categories %}
                    <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endfor %}
                </select>

                <label for="brand">Brand</label>
                <select id="brand" name="brand">
                    <option value="">All brands</option>
                    {% for brand in brands %}
                    <option value="{{ brand }}">{{ brand }}</option>
                    {% endfor %}
                </select>

                <div style="display: flex; gap: 0.75rem;">
                    <div style="flex: 1;">
                        <label for="min_price">Min price</label>
                        <input type="number" id="min_price" name="min_price" min="0" step="0.01" placeholder="0">
                    </div>
                    <div style="flex: 1;">
                        <label for="max_price">Max price</label>
                        <input type="number" id="max_price" name="max_price" min="0" step="0.01" placeholder="Any">
                    </div>
                </div>
            </div>
        </div>
    </form>
</section>

<div id="product-grid">
    {% include "partials/product_grid.html" %}
</div>
{% endblock %}
