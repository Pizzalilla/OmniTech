services:
  student-1:
    build: ./student-1
    container_name: student-1
    ports:
      - "5001:5000"
    volumes:
      - ./student-1:/app
    environment:
      - FLASK_ENV=development
      - OLLAMA_HOST=http://ollama-service:11434
    depends_on:
      - ollama-service
    networks:
      - omnitech-net

  student-2:
    build: ./student-2
    container_name: student-2
    ports:
      - "5002:5000"
    volumes:
      - ./student-2:/app
    environment:
      - FLASK_ENV=development
      - OLLAMA_HOST=http://ollama-service:11434
    depends_on:
      - ollama-service
    networks:
      - omnitech-net

  student-3:
    build: ./student-3
    container_name: student-3
    ports:
      - "5003:5000"
    volumes:
      - ./student-3:/app
    environment:
      - FLASK_ENV=development
      - OLLAMA_HOST=http://ollama-service:11434
    depends_on:
      - ollama-service
    networks:
      - omnitech-net

  student-4:
    build: ./student-4
    container_name: student-4
    ports:
      - "5004:5004"
      - "5014:5014"
    volumes:
      - ./student-4:/app
    environment:
      - FLASK_ENV=development
      - OLLAMA_HOST=http://ollama-service:11434
    depends_on:
      - ollama-service
    networks:
      - omnitech-net

  student-5:
    build: ./student-5
    container_name: student-5
    ports:
      - "5005:5000"
    volumes:
      - ./student-5:/app
    environment:
      - FLASK_ENV=development
      - OLLAMA_HOST=http://ollama-service:11434
    depends_on:
      - ollama-service
    networks:
      - omnitech-net

  ollama-service:
    image: ollama/ollama:latest
    container_name: ollama-service
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - omnitech-net

networks:
  omnitech-net:
    driver: bridge

volumes:
  ollama-data:
