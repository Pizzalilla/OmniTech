<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ service_name }} - OmniTech</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        body { padding: 0; }

        .page-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .top-bar {
            background: linear-gradient(135deg, var(--color-slate-blue), var(--color-light-blue));
            color: var(--text-inverse);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .top-bar h1 { font-size: 1.1rem; font-weight: 700; }
        .top-bar a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .top-bar a:hover { color: #fff; }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem 1.5rem 0;
            overflow: hidden;
        }

        /* Session tabs */
        .session-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }
        .session-bar-scroll {
            flex: 1;
            display: flex;
            gap: 0.4rem;
            overflow-x: auto;
            padding-bottom: 2px;
        }
        .session-bar-scroll::-webkit-scrollbar { height: 3px; }
        .session-bar-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .session-tab {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.4rem 0.75rem;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
        }
        .session-tab:hover { border-color: var(--primary); }
        .session-tab.active {
            background: var(--primary);
            color: var(--text-inverse);
            border-color: var(--primary);
        }
        .session-tab .close-tab {
            font-size: 0.7rem;
            opacity: 0;
            margin-left: 0.2rem;
            padding: 0 2px;
            line-height: 1;
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
        }
        .session-tab:hover .close-tab { opacity: 0.6; }
        .session-tab .close-tab:hover { opacity: 1; }

        .btn-new-session {
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Chat area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md) var(--radius-md) 0 0;
            overflow: hidden;
            min-height: 0;
        }

        .chat-header {
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--bg-surface);
            flex-shrink: 0;
        }
        .chat-header h2 {
            font-size: 0.95rem;
            font-weight: 600;
            flex: 1;
            border: none;
            padding: 0;
            margin: 0;
        }
        .chat-header .btn-edit {
            padding: 0.25rem 0.6rem;
            font-size: 0.75rem;
            background: var(--bg-surface-soft);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .chat-header .btn-edit:hover { background: var(--border); }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem 1.25rem 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 72%;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .message-user {
            align-self: flex-end;
            background: var(--primary);
            color: var(--text-inverse);
            border-bottom-right-radius: 4px;
        }
        .message-assistant {
            align-self: flex-start;
            background: var(--bg-surface-soft);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }
        .message-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
            opacity: 0.7;
        }
        .message-user .message-meta { color: rgba(255,255,255,0.65); }

        /* Recommendations strip */
        .recs-strip {
            padding: 0.6rem 1.25rem;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            overflow-x: auto;
            flex-shrink: 0;
            background: var(--bg-page);
        }
        .recs-strip-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }
        .rec-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.25rem 0.6rem;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            white-space: nowrap;
            color: var(--text-primary);
        }
        .rec-chip-cat {
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Input area */
        .chat-input-area {
            padding: 0.75rem 1.25rem;
            border-top: 1px solid var(--border);
            background: var(--bg-surface);
            flex-shrink: 0;
        }
        .chat-form {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .chat-form input {
            flex: 1;
            padding: 0.65rem 0.85rem;
            margin: 0;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
        }
        .chat-form input:focus {
            border-color: var(--border-strong);
            box-shadow: 0 0 0 3px rgba(129, 166, 198, 0.25);
            outline: none;
        }
        .chat-form .btn-send {
            padding: 0.65rem 1rem;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        /* Empty state */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            gap: 0.5rem;
            padding: 3rem;
        }
        .empty-state .icon { font-size: 2.5rem; opacity: 0.5; }
        .empty-state p { font-size: 0.9rem; }

        /* Edit title inline */
        .edit-title-form {
            display: flex;
            gap: 0.4rem;
            align-items: center;
        }
        .edit-title-form input {
            padding: 0.3rem 0.6rem;
            font-size: 0.85rem;
            margin: 0;
            width: 220px;
        }
        .edit-title-form button {
            padding: 0.3rem 0.6rem;
            font-size: 0.75rem;
        }
        .edit-title-form .btn-cancel {
            background: var(--bg-surface-soft);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 640px) {
            .content-area { padding: 0.75rem 0.75rem 0; }
            .message { max-width: 88%; }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <header class="top-bar">
            <h1>OmniTech &mdash; {{ service_name }}</h1>
            <a href="http://localhost:8080">&larr; Back to Home</a>
        </header>

        <div class="content-area">
            <!-- Session tabs -->
            <div class="session-bar">
                <div class="session-bar-scroll" id="session-tabs"
                     hx-get="/partials/session-list"
                     hx-trigger="load"
                     hx-swap="innerHTML">
                </div>
                <button class="btn btn-new-session" onclick="createSession()">+ New</button>
            </div>

            <!-- Chat container -->
            <div class="chat-container" id="chat-panel">
                <div class="empty-state">
                    <div class="icon">&#128172;</div>
                    <p>Start a new consultation or select one above</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let activeSessionId = null;

        function createSession() {
            fetch("/api/sessions", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title: "New Consultation" }),
            })
            .then(r => r.json())
            .then(session => {
                refreshSessionList();
                loadSession(session.id);
            });
        }

        function refreshSessionList() {
            htmx.ajax("GET", "/partials/session-list", "#session-tabs");
        }

        function loadSession(sessionId) {
            activeSessionId = sessionId;
            htmx.ajax("GET", "/partials/chat/" + sessionId, "#chat-panel");
            setTimeout(() => {
                document.querySelectorAll(".session-tab").forEach(el => {
                    el.classList.toggle("active", el.dataset.id == sessionId);
                });
            }, 100);
        }

        function deleteSession(sessionId, event) {
            event.stopPropagation();
            if (!confirm("Delete this consultation?")) return;
            fetch("/api/sessions/" + sessionId, { method: "DELETE" })
            .then(() => {
                refreshSessionList();
                if (activeSessionId == sessionId) {
                    activeSessionId = null;
                    document.getElementById("chat-panel").innerHTML =
                        '<div class="empty-state"><div class="icon">&#128172;</div><p>Start a new consultation or select one above</p></div>';
                }
            });
        }

        function sendMessage(sessionId) {
            const input = document.getElementById("chat-input");
            const message = input.value.trim();
            if (!message) return;

            const messagesDiv = document.getElementById("chat-messages");

            const userBubble = document.createElement("div");
            userBubble.className = "message message-user";
            userBubble.textContent = message;
            messagesDiv.appendChild(userBubble);

            const typing = document.createElement("div");
            typing.className = "message message-assistant";
            typing.id = "typing-indicator";
            typing.innerHTML = '<span class="spinner"></span> Thinking...';
            messagesDiv.appendChild(typing);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            input.value = "";
            input.disabled = true;

            fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ session_id: sessionId, message: message }),
            })
            .then(r => r.json())
            .then(data => {
                const indicator = document.getElementById("typing-indicator");
                if (indicator) indicator.remove();

                const aiBubble = document.createElement("div");
                aiBubble.className = "message message-assistant";
                aiBubble.textContent = data.content;
                messagesDiv.appendChild(aiBubble);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                input.disabled = false;
                input.focus();
                refreshSessionList();
            })
            .catch(() => {
                const indicator = document.getElementById("typing-indicator");
                if (indicator) indicator.remove();

                const errBubble = document.createElement("div");
                errBubble.className = "message message-assistant";
                errBubble.textContent = "Something went wrong. Please try again.";
                messagesDiv.appendChild(errBubble);
                input.disabled = false;
                input.focus();
            });
        }

        function startEditTitle(sessionId, currentTitle) {
            const header = document.getElementById("chat-title");
            header.innerHTML =
                '<form class="edit-title-form" onsubmit="saveTitle(' + sessionId + ', event)">' +
                '<input type="text" id="title-input" value="' + currentTitle.replace(/"/g, '&quot;') + '" />' +
                '<button type="submit" class="btn" style="font-size:0.75rem;padding:0.3rem 0.6rem;">Save</button>' +
                '<button type="button" class="btn-cancel" onclick="loadSession(' + sessionId + ')">Cancel</button>' +
                '</form>';
            document.getElementById("title-input").focus();
        }

        function saveTitle(sessionId, event) {
            event.preventDefault();
            const newTitle = document.getElementById("title-input").value.trim();
            if (!newTitle) return;
            fetch("/api/sessions/" + sessionId, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title: newTitle }),
            })
            .then(() => {
                loadSession(sessionId);
                refreshSessionList();
            });
        }

        function handleChatKeydown(event, sessionId) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage(sessionId);
            }
        }
    </script>
</body>
</html>
