<div class="chatview">
    <div class="chat-head">
        <span class="chat-head__title" id="chat-title-slot">{{ session.title }}</span>
        <span id="chat-head-actions">
            <button class="btn-mini"
                    onclick="startEditTitle({{ session.id }}, '{{ session.title | replace('\\', '\\\\') | replace("'", "\\'") }}')">Rename</button>
            <button class="btn-mini" onclick="askClearHistory({{ session.id }})">Clear history</button>
        </span>
    </div>

    <div class="messages" id="chat-messages">
        {% include "partials/messages.html" %}
    </div>

    <div class="dock">
        <div class="dock__title">Saved recommendations</div>
        <div id="reco-list">
            {% include "partials/recommendations.html" %}
        </div>
    </div>

    <form class="composer"
          hx-post="/api/chat"
          hx-target="#chat-messages"
          hx-swap="beforeend"
          hx-disabled-elt="find button[type=submit]"
          hx-on::after-request="if(event.detail.successful) this.querySelector('.composer__input').value=''">
        <input type="hidden" name="session_id" value="{{ session.id }}">
        <div class="composer__row">
            <svg class="composer__spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/></svg>
            <input class="composer__input" name="message" type="text" autocomplete="off"
                   placeholder="Ask a follow-up or refine your requirements&hellip;" required>
        </div>
        <div class="composer__tools">
            <span style="font-size:12.5px;color:var(--ink-dim)">Answers are grounded in the OmniTech catalog</span>
            <div class="composer__send-group">
                <span class="spinner" aria-hidden="true"></span>
                <button type="submit" class="icon-circle icon-circle--send" title="Send">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-7-7 16-2-7z"/></svg>
                </button>
            </div>
        </div>
    </form>
</div>
