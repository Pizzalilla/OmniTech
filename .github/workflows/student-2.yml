name: Student 2 CI

on:
  push:
    paths:
      - 'student-2/**'
      - '.github/workflows/student-2.yml'
  pull_request:
    paths:
      - 'student-2/**'
      - '.github/workflows/student-2.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-2/requirements.txt

      - name: Python Syntax Check
        run: |
          python -m py_compile student-2/backend/main.py
          python -m py_compile student-2/backend/agent.py
          python -m py_compile student-2/database/database.py

      - name: Run Tests
        run: |
          cd student-2
          python -m pytest tests/ -v

      - name: Build Docker Image
        run: |
          docker build -t student-2 ./student-2