name: student-1

on:
  push:
    branches: [main, "feature/student-1-**"]
    # other students' folders should not trigger my workflow
    paths:
      - "student-1/**"
      - ".github/workflows/student-1.yml"
  pull_request:
    branches: [main]
    paths:
      - "student-1/**"
      - ".github/workflows/student-1.yml"
  workflow_dispatch:
  # lets cloud-deployment.yml run this workflow as a gate before deploying
  workflow_call:

jobs:
  validate:
    name: validate product catalog sources
    runs-on: ubuntu-latest
    env:
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"
      MULTI_AGENT_ENABLED: "false"
      OLLAMA_HOST: "http://ai-disabled.invalid:11434"
    defaults:
      run:
        working-directory: student-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: student-1/requirements.txt

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: compile backend and database sources
        run: python -m compileall -q backend database

      - name: Endpoint tests (POST /api/products, POST /api/products/id/ai-summary)
        run: |
          set -o pipefail
          python -m pytest tests/test_endpoints.py -v --junitxml=endpoint-results.xml | tee endpoint-results.txt

      - name: run pytest suite
        run: python -m pytest -v

      - name: Upload endpoint test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-1-endpoint-tests
          path: |
            student-1/endpoint-results.xml
            student-1/endpoint-results.txt

  container:
    name: build and smoke test container
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: build image
        run: docker build -t student-1:ci ./student-1

      - name: start container
        run: >
          docker run -d --name student-1-ci -p 5001:5000
          -e MCP_ENABLED=false
          -e RAG_ENABLED=false
          -e MULTI_AGENT_ENABLED=false
          -e OLLAMA_HOST=http://ai-disabled.invalid:11434
          -e OLLAMA_TIMEOUT=2
          student-1:ci

      - name: wait for health endpoint
        run: |
          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:5001/health; then
              echo "service is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "service did not become healthy in time"
          docker logs student-1-ci
          exit 1

      - name: verify seeded catalog meets ten record minimum
        run: |
          for table in categories products; do
            count=$(curl -fsS "http://localhost:5001/api/$table" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
            echo "$table rows: $count"
            test "$count" -ge 10
          done

      - name: AI-off fallback stays up
        run: |
          code=$(curl -s -o /tmp/ma.txt -w "%{http_code}" http://localhost:5001/api/multi-agent/history)
          echo "multi-agent history: $code"
          test "$code" = "503"
          grep -q disabled /tmp/ma.txt
          code=$(curl -s -o /tmp/ai.txt -w "%{http_code}" -X POST http://localhost:5001/api/products/1/ai-summary)
          echo "ai-summary: $code"
          test "$code" = "503"
          grep -q unavailable /tmp/ai.txt
          curl -fsS http://localhost:5001/api/products >/dev/null

      - name: remove container
        if: always()
        run: docker rm -f student-1-ci
