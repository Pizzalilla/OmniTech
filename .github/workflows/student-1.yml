name: student-1

on:
  push:
    branches: [main, "feature/student-1-**"]
    paths:
      - "student-1/**"
      - ".github/workflows/student-1.yml"
  pull_request:
    branches: [main]
    paths:
      - "student-1/**"
      - ".github/workflows/student-1.yml"
  workflow_dispatch:

jobs:
  validate:
    name: validate product catalog sources
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: student-1/requirements.txt

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: compile backend and database sources
        run: python -m compileall -q backend database

      - name: run pytest suite
        run: python -m pytest -v

  container:
    name: build and smoke test container
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: build image
        run: docker build -t student-1:ci ./student-1

      - name: start container
        run: docker run -d --name student-1-ci -p 5001:5000 student-1:ci

      - name: wait for health endpoint
        run: |
          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:5001/health; then
              echo "service is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "service did not become healthy in time"
          docker logs student-1-ci
          exit 1

      - name: verify seeded catalog meets ten record minimum
        run: |
          for table in categories products; do
            count=$(curl -fsS "http://localhost:5001/api/$table" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
            echo "$table rows: $count"
            test "$count" -ge 10
          done

      - name: remove container
        if: always()
        run: docker rm -f student-1-ci
