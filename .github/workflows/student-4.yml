name: Student 4 CI Pipeline

on:
  push:
    paths:
      - 'student-4/**'
      - 'ai-services/rag-server/**'
      - 'ai-services/mcp-server/**'
      - 'ai-services/multi-agent-server/**'
      - '.github/workflows/student-4.yml'
  pull_request:
    paths:
      - 'student-4/**'
      - 'ai-services/rag-server/**'
      - 'ai-services/mcp-server/**'
      - 'ai-services/multi-agent-server/**'
      - '.github/workflows/student-4.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # No AI servers in CI: keep them switched off (tests use fake responses)
      AI_ENABLED: "false"
      RAG_ENABLED: "false"
      MCP_ENABLED: "false"
      MULTI_AGENT_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-4/requirements.txt

      - name: Initialize SQLite Database
        run: |
          python student-4/database/init_db.py

      - name: Launch Student 4 Service (Port 5004)
        run: |
          python student-4/backend/main.py &
          sleep 3

      - name: Smoke test running service
        run: |
          curl -fsS http://127.0.0.1:5004/api/health
          curl -fsS http://127.0.0.1:5004/ > /dev/null

      # RELEASE 2: the two Student 4 endpoint functions, tested against the running service
      - name: "Post-commit endpoint tests: POST /api/orders (create_order) + PUT /api/orders/<id> (update_order)"
        run: |
          pytest student-4/tests/test_post_commit_endpoints.py -v -rA

      - name: Run Automated Pytest Suite (live AI tests skipped - no Ollama in CI)
        run: |
          pytest student-4/tests/test_orders_api.py -v \
            --deselect student-4/tests/test_orders_api.py::test_ai_helper_custom_question \
            --deselect student-4/tests/test_orders_api.py::test_ai_helper_grounded_json \
            --deselect student-4/tests/test_orders_api.py::test_mcp_order_lookup_live \
            --deselect student-4/tests/test_orders_api.py::test_rag_card_live

      - name: Run AI Agent, MCP, RAG, Multi-Agent card and AI-off tests (all faked, no servers needed)
        run: |
          pytest student-4/tests/test_agent.py student-4/tests/test_mcp.py student-4/tests/test_rag_card.py student-4/tests/test_multi_agent_card.py student-4/tests/test_ai_off.py -v

      - name: Run Shared RAG Server Tests (Student 4 knowledge + /rag/retrieve)
        run: |
          cd ai-services/rag-server && python -m pytest tests/ -v

      - name: Run Shared MCP Server Tests (Student 4 tools)
        run: |
          cd ai-services/mcp-server && python -m pytest tests/ -v

      - name: Run Shared Multi-Agent Server Tests (Ollama faked)
        run: |
          cd ai-services/multi-agent-server && python -m pytest tests/test_multi_agent.py -v

      - name: Build Docker Image
        run: |
          docker build -t student-4:ci ./student-4
