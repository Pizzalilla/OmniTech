name: Student 4 CI Workflow

on:
  push:
    paths:
      - 'student-4/**'
      - '.github/workflows/student-4.yml'
  pull_request:
    paths:
      - 'student-4/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors requests openai pytest

      - name: Initialize Database
        run: |
          python student-4/database/init_db.py

      - name: Start Database Service
        run: |
          python student-4/database/app.py &
          sleep 3

      - name: Start Backend Service
        run: |
          python student-4/backend/app.py &
          sleep 3

      - name: Run Test Suite
        run: |
          pytest student-4/tests/test_orders_api.py -v
