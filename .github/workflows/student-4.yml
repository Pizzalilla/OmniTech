name: Student 4 CI Pipeline

on:
  push:
    paths:
      - 'student-4/**'
      - '.github/workflows/student-4.yml'
  pull_request:
    paths:
      - 'student-4/**'
      - '.github/workflows/student-4.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors requests openai pytest

      - name: Initialize SQLite Database
        run: |
          python student-4/database/init_db.py

      - name: Launch Database Microservice
        run: |
          python student-4/database/app.py &
          sleep 3

      - name: Launch Backend Microservice 
        run: |
          python student-4/backend/app.py &
          sleep 3

      - name: Smoke test running services
        run: |
          curl -fsS http://127.0.0.1:5014/
          curl -fsS http://127.0.0.1:5004/ > /dev/null

      - name: Run Automated Pytest Suite
        run: |
          pytest student-4/tests/test_orders_api.py -v

      - name: Build Docker Image
        run: |
          docker build -t student-4:ci ./student-4

