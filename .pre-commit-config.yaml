# Release 2 pre-commit security scans: Ruff security rules, detect-secrets and pip-audit.
# Setup (once): pip install -r scripts/test/requirements-security.txt && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        name: ruff security rules
        args: [--no-fix]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # image_tag is the deployed git commit hash, written by deploy.sh into the cloud evidence
        args: [--baseline, .secrets.baseline, --exclude-lines, '"image_tag": "[0-9a-f]{7,40}"']
        exclude: '\.(png|jpe?g|pdf|db|ttf|ico)$'

  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (dependencies of the projects you changed)
        entry: python scripts/test/precommit_pip_audit.py
        language: python
        additional_dependencies: [pip-audit==2.10.1]
        files: '^(student-\d|ai-services/[^/]+)/'
